<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Perfumes | INICIO</title>
<link rel="stylesheet" href="/static/css/animations.css">
    <style>
        /* Import Cronde Font */
        @font-face {
            font-family: 'Cronde';
            src: url('/static/fonts/cronde.woff2') format('woff2'),
                 url('/static/fonts/cronde.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Cronde', 'Arial', sans-serif;
            background: white;
        }
        
        /* Navigation Bar */
.navbar {
    background: #B9B59F;
    padding: 20px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    position: relative;
}

/* Brand - Far Left (CRONDE font) */
.brand {
    font-family: 'Cronde', 'Georgia', serif;
    font-size: 24px;
    font-weight: normal;
    color: #060644;
    text-decoration: none;
    letter-spacing: 2px;
}

/* Center Navigation Links - Montserrat font */
.nav-links {
    display: flex;
    gap: 50px;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
}

.nav-links a {
    font-family: 'Montserrat', sans-serif;
    color: #060644;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: opacity 0.3s;
}

.nav-links a:hover {
    opacity: 0.7;
}
        
        .nav-icons {
            display: flex;
            gap: 25px;
            align-items: center;
        }
        
        .nav-icons a {
            color: #060644;
            text-decoration: none;
            transition: opacity 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .icon {
            width: 22px;
            height: 22px;
            stroke: #060644;
            stroke-width: 1.5;
            fill: none;
        }
        
        /* Breadcrumb */
/* Breadcrumb */
.breadcrumb {
    padding: 40px 40px 20px 40px;
    background: white;
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: #666;
}

.breadcrumb a {
    color: #060644;
    text-decoration: none;
    transition: opacity 0.3s;
}

.breadcrumb a:hover {
    opacity: 0.7;
}

/* Space around the > symbol - reduced */
.breadcrumb span {
    margin: 0 5px;
}

/* If you have text like "Home > Perfumes" without span, add space between words */
.breadcrumb {
    word-spacing: 12px;
}
        
        /* Products Container */
        .products-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 40px;
        }
        
        /* Filter Section */
.filter-section {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 40px;
    flex-wrap: wrap;
    gap: 20px;
}

.filter-buttons {
    display: flex;
    gap: 15px;
}
        
        .filter-btn {
    padding: 8px 25px;
    background: white;
    border: 2px solid #060644;
    color: #060644;
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    border-radius: 30px;
    cursor: pointer;
    transition: all 0.3s;
}
        
        .filter-btn.active {
            background: #060644;
            color: white;
        }
        
        .filter-btn:hover {
            background: #060644;
            color: white;
        }
        
        /* Products Grid */
.products-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 30px;
}

.product-card {
    background: white;
    border-radius: 20px;
    padding: 20px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s;
    box-shadow: 0 4px 15px rgba(6, 6, 68, 0.08);
}

.product-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 25px rgba(6, 6, 68, 0.12);
}

.product-image {
    width: 100%;
    height: 200px;
    background: #fafafa;
    border-radius: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 15px;
    overflow: hidden;
}

.product-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 15px;
}

.product-category {
    font-family: 'Montserrat', sans-serif;
    font-size: 10px;
    font-weight: 500;
    color: #B9B59F;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 8px;
}

.product-name {
    font-family: 'Montserrat', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #060644;
    margin: 8px 0;
    letter-spacing: 0.5px;
}

.product-desc {
    font-family: 'Montserrat', sans-serif;
    font-size: 12px;
    font-weight: 400;
    color: #888;
    margin: 5px 0;
}

.product-price {
    font-family: 'Montserrat', sans-serif;
    font-size: 18px;
    font-weight: 600;
    color: #060644;
    margin: 10px 0;
}

.add-to-cart {
    display: inline-block;
    margin-top: 10px;
    padding: 10px 25px;
    background: #060644;
    color: white;
    font-family: 'Montserrat', sans-serif;
    font-size: 12px;
    font-weight: 600;
    text-decoration: none;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-radius: 30px;
    transition: opacity 0.3s;
    border: none;
    cursor: pointer;
}

.add-to-cart:hover {
    opacity: 0.8;
}
        
/* Responsive Design */
@media (max-width: 900px) {
    .navbar {
        flex-direction: column;
        gap: 15px;
    }
    .nav-links {
        position: static;
        transform: none;
        gap: 30px;
        margin: 10px 0;
    }
    .nav-links a {
        font-size: 11px;
        letter-spacing: 1.5px;
    }
    .filter-section {
        flex-direction: column;
        text-align: center;
    }
}

@media (max-width: 600px) {
    .nav-links {
        gap: 15px;
        flex-wrap: wrap;
        justify-content: center;
    }
    .nav-links a {
        font-size: 9px;
        letter-spacing: 1px;
    }
    .products-grid {
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 15px;
    }
}

/* Notification Toast */
.notification {
    position: fixed;
    bottom: 30px;
    right: 30px;
    background: #060644;
    color: white;
    padding: 12px 20px;
    border-radius: 8px;
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    font-weight: 500;
    z-index: 1000;
    animation: slideIn 0.3s ease;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

@keyframes slideIn {
    from {
        transform: translateX(100%);
        opacity: 0;
    }
    to {
        transform: translateX(0);
        opacity: 1;
    }
}

footer {
    background: #060644;
    color: #B9B59F;
    text-align: center;
    padding: 40px;
    font-family: 'Montserrat', sans-serif;
    font-size: 14px;
    margin-top: 60px;
}

/* Search Modal */
.search-overlay {
    position: fixed;
    top: 0;
    right: -100%;
    width: 100%;
    max-width: 500px;
    height: 100vh;
    background: white;
    box-shadow: -5px 0 30px rgba(0,0,0,0.1);
    z-index: 2000;
    transition: right 0.3s ease;
    padding: 30px;
    overflow-y: auto;
}

.search-overlay.active {
    right: 0;
}

.search-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 1px solid #eee;
}

.search-header h3 {
    font-family: 'Cronde', 'Georgia', serif;
    font-size: 24px;
    color: #060644;
    font-weight: normal;
}

.close-search {
    font-size: 28px;
    cursor: pointer;
    color: #666;
    transition: color 0.3s;
}

.close-search:hover {
    color: #e53e3e;
}

.search-input-wrapper {
    margin-bottom: 30px;
}

.search-input-wrapper input {
    width: 100%;
    padding: 14px 18px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-family: 'Montserrat', sans-serif;
    font-size: 15px;
}

.search-input-wrapper input:focus {
    outline: none;
    border-color: #060644;
}

.search-results {
    margin-top: 20px;
}

.search-result-item {
    display: flex;
    gap: 15px;
    padding: 15px;
    border-bottom: 1px solid #eee;
    cursor: pointer;
    transition: background 0.3s;
}

.search-result-item:hover {
    background: #f9f9f9;
}

.search-result-image {
    width: 60px;
    height: 60px;
    background: #f5f5f5;
    border-radius: 10px;
    overflow: hidden;
}

.search-result-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.search-result-info h4 {
    font-family: 'Montserrat', sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: #060644;
    margin-bottom: 5px;
}

.search-result-info p {
    font-size: 13px;
    color: #888;
}

.no-results {
    text-align: center;
    padding: 40px;
    color: #666;
    font-family: 'Montserrat', sans-serif;
}

.search-overlay-backdrop {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    z-index: 1999;
    display: none;
}

.search-overlay-backdrop.active {
    display: block;
}

/* Out of Stock Styles */
.product-image {
    position: relative;
    overflow: hidden;
}

.out-of-stock-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(0,0,0,0.7);
    color: white;
    padding: 5px 10px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 600;
    z-index: 10;
}

.out-of-stock-btn {
    background: #ccc !important;
    cursor: not-allowed !important;
    opacity: 0.6;
}

.out-of-stock-btn:hover {
    transform: none !important;
    box-shadow: none !important;
}

    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="brand">INICIO</a>
        
        <div class="nav-links">
            <a href="/">HOME</a>
            <a href="/products">PERFUMES</a>
            <a href="/our-story">OUR STORY</a>
            <a href="/faq">FAQS</a>
        </div>
        
        <div class="nav-icons">
            <a href="#" id="searchIcon" title="Search">
                <svg class="icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" fill="none">
                    <circle cx="10.5" cy="10.5" r="7.5"/>
                    <line x1="16.5" y1="16.5" x2="22" y2="22"/>
                </svg>
            </a>
            <a href="/cart" title="Cart">
                <svg class="icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" fill="none">
                    <circle cx="9" cy="20" r="1.5"/>
                    <circle cx="17" cy="20" r="1.5"/>
                    <path d="M3 3h2l2 12h12l2-8H6"/>
                </svg>
            </a>
            <a href="/dashboard_redirect" title="Account">
                <svg class="icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" fill="none">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M5 20v-2a7 7 0 0 1 14 0v2"/>
                </svg>
            </a>
        </div>
    </nav>

    <div class="breadcrumb">
    <a href="/">Home</a> <span>></span> Perfumes
</div>
    <div class="products-container">
        <div class="filter-section">
            <div class="filter-buttons">
                <button class="filter-btn active" data-category="all">All</button>
                <button class="filter-btn" data-category="men">Men</button>
                <button class="filter-btn" data-category="women">Women</button>
                <button class="filter-btn" data-category="unisex">Unisex</button>
            </div>
        </div>

        <div class="products-grid" id="productsGrid">
            <!-- Products will be loaded here by JavaScript -->
        </div>
    </div>

    <script>
    let allProducts = [];
    let currentCategory = 'all';

    // Fetch products from database
    async function loadProducts() {
        try {
            const response = await fetch('/api/products');
            const products = await response.json();
            allProducts = products;
            console.log('Products loaded:', allProducts.length);
            displayProducts(currentCategory);
        } catch (error) {
            console.error('Error loading products:', error);
        }
    }

    function displayProducts(category) {
    const grid = document.getElementById('productsGrid');
    let filteredProducts = allProducts;
    
    if (category !== 'all') {
        filteredProducts = allProducts.filter(p => p.category === category);
    }
    
    grid.innerHTML = '';
    
    if (filteredProducts.length === 0) {
        grid.innerHTML = '<p style="text-align:center; color:#666;">No products found in this category.</p>';
        return;
    }
    
    filteredProducts.forEach(product => {
        const card = document.createElement('div');
        card.className = 'product-card';
        
        let imagePath = product.image_url || product.name.toLowerCase().replace(/ /g, '-') + '.png';
        const isOutOfStock = product.stock <= 0;
        
        card.innerHTML = `
            <div class="product-image" onclick="location.href='/perfume/${product.id}'">
                <img src="/static/images/${imagePath}" alt="${product.name}" onerror="this.src='https://via.placeholder.com/200x200/B9B59F/060644?text=${product.name.replace(/ /g, '+')}'">
                ${isOutOfStock ? '<div class="out-of-stock-badge">Out of Stock</div>' : ''}
            </div>
            <div class="product-category" onclick="location.href='/perfume/${product.id}'">EXTRAIT DE PARFUM</div>
            <div class="product-name" onclick="location.href='/perfume/${product.id}'">${product.name}</div>
            <div class="product-desc" onclick="location.href='/perfume/${product.id}'">${product.description || 'Premium fragrance'}</div>
            <div class="product-price" onclick="location.href='/perfume/${product.id}'">₱${product.price}</div>
            ${isOutOfStock ? 
                '<button class="add-to-cart out-of-stock-btn" disabled>Out of Stock</button>' : 
                '<button class="add-to-cart" onclick="event.stopPropagation(); addToCart(${product.id}, \'${product.name}\')">Add to Cart</button>'
            }
        `;
        
        grid.appendChild(card);
    });
}

    function addToCart(productId, productName) {
    console.log('Adding to cart:', productId, productName);
    
    fetch(`/add_to_cart/${productId}`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
        },
        body: 'quantity=1'
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            // Show notification
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.innerHTML = `${productName} added to cart!`;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 2000);
        } else {
            alert('Error adding to cart');
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('Network error');
    });
}

    // Filter button functionality
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentCategory = this.getAttribute('data-category');
            displayProducts(currentCategory);
        });
    });

    // Load products when page loads
    loadProducts();
</script>

<footer>
    <p>© 2024 INICIO Parfum. All rights reserved.</p>
    <p style="margin-top: 10px; font-size: 12px;">Luxury fragrances for the bold and the brave</p>
</footer>

   <!-- Search Modal -->
    <div class="search-overlay-backdrop" id="searchBackdrop"></div>
    <div class="search-overlay" id="searchOverlay">
        <div class="search-header">
            <h3>Search</h3>
            <span class="close-search" id="closeSearch">&times;</span>
        </div>
        <div class="search-input-wrapper">
            <input type="text" id="searchInput" placeholder="Search for a fragrance..." autocomplete="off">
        </div>
        <div class="search-results" id="searchResults">
        </div>
    </div>

    <script src="/static/js/search.js"></script>
<script src="/static/js/transitions.js"></script>

</body>
</html>
